name: CLI Proxy Download

on:
  workflow_dispatch:

jobs:
  download_and_proxy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write   # مجوز ساخت Release

    steps:
      - name: Find latest successful build
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --repo KhalilShalbaf/AutomationDesigner --status success --limit 10 \
            --json databaseId,name \
            --jq '[.[] | select(.name == "Build AutomationDesigner")][0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download artifact and zip it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.find.outputs.run_id }}" -n "AutomationDesigner-Installer" --dir ./dl --repo KhalilShalbaf/AutomationDesigner
          cd ./dl
          zip -r ../AutomationDesigner-Installer.zip .
          cd ..
          ls -lh AutomationDesigner-Installer.zip

      - name: Publish as GitHub Release (گزینه اصلی)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="installer-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" ./AutomationDesigner-Installer.zip \
            --repo KhalilShalbaf/AutomationDesigner \
            --title "AutomationDesigner Installer" \
            --notes "لینک دانلود مستقیم فایل نصب"
          echo "به صفحه Releases بروید: https://github.com/KhalilShalbaf/AutomationDesigner/releases"

      - name: Fallback - tmpfiles.org (قبلاً در شبکه شما کار کرده)
        run: |
          echo "=== tmpfiles (فراموش نکنید /dl/ را اضافه کنید) ==="
          curl -s -F "file=@./AutomationDesigner-Installer.zip" https://tmpfiles.org/api/v1/upload
          echo ""

      - name: Fallback - pixeldrain
        run: |
          echo "=== pixeldrain ==="
          curl -s -F "file=@./AutomationDesigner-Installer.zip" https://pixeldrain.com/api/file/
          echo ""

      - name: Fallback - uguu.se
        run: |
          echo "=== uguu ==="
          curl -s -F "files[]=@./AutomationDesigner-Installer.zip" https://uguu.se/upload
          echo ""
