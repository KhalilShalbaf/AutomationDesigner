name: Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore AutomationDesigner.sln

      - name: Create signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=GitHubActions" -CertStoreLocation "Cert:\CurrentUser\My"
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild AutomationDesigner.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=true /p:ManifestKeyFile="" /p:ManifestCertificateThumbprint=$env:CERT_THUMBPRINT /verbosity:minimal

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish" | Out-Null
          Copy-Item -Path "AutomationDesigner\bin\Release\*" -Destination "publish" -Recurse
          Copy-Item -Path "INSTALL.bat" -Destination "publish"
          Compress-Archive -Path "publish\*" -DestinationPath "AutomationDesigner-Setup.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AutomationDesigner-Setup
          path: AutomationDesigner-Setup.zip
