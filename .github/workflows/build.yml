name: Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore AutomationDesigner.sln

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild AutomationDesigner.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /verbosity:minimal

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish" | Out-Null
          Copy-Item -Path "AutomationDesigner\bin\Release\*" -Destination "publish" -Recurse
          Copy-Item -Path "INSTALL.bat" -Destination "publish"
          Compress-Archive -Path "publish\*" -DestinationPath "AutomationDesigner-Setup.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AutomationDesigner-Setup
          path: AutomationDesigner-Setup.zip
