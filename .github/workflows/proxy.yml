name: CLI Proxy Download

on:
  workflow_dispatch:

jobs:
  download_and_proxy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Find latest successful build
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --repo KhalilShalbaf/AutomationDesigner --status success --limit 10 \
            --json databaseId,name \
            --jq '[.[] | select(.name == "Build AutomationDesigner")][0].databaseId')
          echo "شناسه آخرین بیلد موفق: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "در حال دانلود آرتیفکت..."
          gh run download "${{ steps.find.outputs.run_id }}" -n "AutomationDesigner-Installer" --dir ./dl --repo KhalilShalbaf/AutomationDesigner
          
          echo "=== بررسی فایل‌های دانلود شده ==="
          find ./dl -type f -exec ls -lh {} \;
          
          # اگر فقط یک فایل زیپ است، آن را کپی می‌کنیم
          if [ -f "./dl/AutomationDesigner-Installer.zip" ]; then
            cp ./dl/AutomationDesigner-Installer.zip ./AutomationDesigner-Installer.zip
          else
            # اگر فایل‌ها به صورت Extracted هستند، دوباره زیپ می‌کنیم
            cd ./dl
            zip -r ../AutomationDesigner-Installer.zip .
            cd ..
          fi
          
          echo "=== فایل نهایی ==="
          ls -lh AutomationDesigner-Installer.zip
          file AutomationDesigner-Installer.zip

      - name: Upload to file.io (Raw Output)
        run: |
          echo "=== خروجی خام file.io ==="
          curl -s -F "file=@./AutomationDesigner-Installer.zip" https://file.io
          echo ""
          echo "=== پایان ==="

      - name: Upload to 0x0.st
        run: |
          echo "=== لینک 0x0.st ==="
          curl -s -F "file=@./AutomationDesigner-Installer.zip" https://0x0.st
          echo ""
          echo "=== پایان ==="

      - name: Upload to catbox.moe
        run: |
          echo "=== لینک catbox.moe ==="
          curl -s -F "reqtype=fileupload" -F "fileToUpload=@./AutomationDesigner-Installer.zip" https://catbox.moe/user/api.php
          echo ""
          echo "=== پایان ==="

      - name: Upload to litterbox (Temporary catbox)
        run: |
          echo "=== لینک litterbox (موقت ۱ ساعته) ==="
          curl -s -F "reqtype=fileupload" -F "time=1h" -F "fileToUpload=@./AutomationDesigner-Installer.zip" https://litterbox.catbox.moe/resources/internals/api.php
          echo ""
          echo "=== پایان ==="
