name: CLI Proxy Download
on: workflow_dispatch

jobs:
  download_and_proxy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      
    steps:
      - name: Download via GitHub CLI (Bulletproof Method)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "در حال دانلود آرتیفکت با ابزار رسمی GitHub CLI..."
          # دانلود مستقیم از طریق شناسه اجرای قبلی
          gh run download 31940981870 -n "AutomationDesigner-Installer" --repo KhalilShalbaf/AutomationDesigner
          
          echo "=== بررسی فایل دانلود شده ==="
          ls -lh AutomationDesigner-Installer.zip
          file AutomationDesigner-Installer.zip
          echo "================================="

      - name: Upload to file.io (Direct Link)
        run: |
          echo "لینک دانلود از file.io:"
          curl -s -F "file=@./AutomationDesigner-Installer.zip" https://file.io | jq -r '.link'

      - name: Upload to catbox.moe (Direct Link)
        run: |
          echo "لینک دانلود از catbox.moe:"
          curl -s -F "reqtype=fileupload" -F "fileToUpload=@./AutomationDesigner-Installer.zip" https://catbox.moe/user/api.php
